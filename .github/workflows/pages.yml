name: Publish preview (GitHub Pages)

# Builds the site and publishes it to GitHub Pages on every push to main, so
# there is always a previewable link:
#   https://andrewmswensen-hue.github.io/bric-news/
#
# GitHub Pages serves the site under /bric-news/, so after the build we
# prefix every root-relative link (see scripts/pages-base.mjs). When the site
# moves to bric.news that step goes away and nothing else changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Prefix links for the /bric-news/ base path
        run: node scripts/pages-base.mjs dist /bric-news

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
