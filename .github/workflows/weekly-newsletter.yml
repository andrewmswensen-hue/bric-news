name: Weekly newsletter draft

# Builds a Beehiiv draft from the week's items. Manual only until the Beehiiv
# publication is connected; a Friday schedule would just fail without keys.
# To turn it on, uncomment the schedule block and add the three secrets:
#   ANTHROPIC_API_KEY, BEEHIIV_API_KEY, BEEHIIV_PUBLICATION_ID

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 11 * * 5'   # Fridays, 7 AM Eastern (daylight time)

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Beehiiv draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
        run: python scripts/newsletter.py

      - name: Keep the preview when Beehiiv is not configured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: scripts/newsletter-preview.html
          if-no-files-found: ignore
