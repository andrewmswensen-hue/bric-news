name: Deploy site

# Builds the Astro site and deploys it to Cloudflare Workers (static assets).
#
# Off by default. Hosting is being moved off the original personal Cloudflare
# account, so this runs only when triggered by hand, or on push to main once
# the repository variable DEPLOY_ON_PUSH is set to "true".
#
# Needs two repository secrets once hosting is settled:
#   CLOUDFLARE_API_TOKEN   (Workers: Edit template)
#   CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
