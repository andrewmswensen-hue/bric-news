name: Daily feed

# Pulls every source in scripts/supplemental_sources.yaml, scores and rewrites
# the day's most relevant items, and either opens a pull request for review
# (before settings.review_required_until) or commits straight to main (after).
#
# Needs one repository secret: ANTHROPIC_API_KEY.

on:
  schedule:
    # 11:30 UTC = 7:30 AM Eastern during daylight time, 6:30 AM in winter.
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Override: review (open a PR) or auto (commit to main). Blank = use the config date.'
        required: false
        default: ''
      dry_run:
        description: 'Collect and filter only. No API calls, nothing written.'
        type: boolean
        default: false
      tier:
        description: 'Run a single tier (local, regional, state, national). Blank = all.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      # Until the secret exists this run ends here with a warning instead of a
      # red X, so the schedule can live on main before the key is added.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::warning title=Daily feed skipped::ANTHROPIC_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ingest
        if: steps.key.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ITEM_REGISTRY_PATH: scripts/item-registry.json
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ -n "${{ inputs.mode }}" ]; then args="$args --mode ${{ inputs.mode }}"; fi
          if [ -n "${{ inputs.tier }}" ]; then args="$args --tier ${{ inputs.tier }}"; fi
          python scripts/supplemental_ingest.py $args

      - name: Read run report
        id: report
        if: steps.key.outputs.skip != 'true'
        run: |
          if [ ! -f scripts/last_run.json ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "count=$(jq '.published | length' scripts/last_run.json)" >> "$GITHUB_OUTPUT"
          echo "mode=$(jq -r '.mode' scripts/last_run.json)" >> "$GITHUB_OUTPUT"
          echo "dry=$(jq -r '.dry_run' scripts/last_run.json)" >> "$GITHUB_OUTPUT"
          echo "date=$(jq -r '.date' scripts/last_run.json)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        if: steps.report.outputs.dry != 'true'
        run: |
          git config user.name "bric-news-bot"
          git config user.email "bot@bric.news"

      # The dedupe ledger goes to main on every run, review mode included, so
      # tomorrow's run never re-scores what today's run already looked at.
      - name: Commit state ledger to main
        if: steps.report.outputs.dry != 'true'
        run: |
          git add scripts/state.json
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "Feed ledger: ${{ steps.report.outputs.date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Nothing to publish
        if: steps.report.outputs.dry != 'true' && steps.report.outputs.count == '0'
        run: echo "No items cleared the bar today."

      - name: Open review pull request
        if: steps.report.outputs.dry != 'true' && steps.report.outputs.count != '0' && steps.report.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="feed/${{ steps.report.outputs.date }}"
          title="Daily feed: ${{ steps.report.outputs.date }} (${{ steps.report.outputs.count }} items)"
          git checkout -B "$branch"
          git add src/content/items
          git commit -m "$title"
          git push -f origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body-file scripts/last_run.md
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file scripts/last_run.md --label "daily-feed" || \
            gh pr create --base main --head "$branch" --title "$title" --body-file scripts/last_run.md
          fi

      - name: Publish directly to main
        if: steps.report.outputs.dry != 'true' && steps.report.outputs.count != '0' && steps.report.outputs.mode == 'auto'
        run: |
          git add src/content/items
          git commit -m "Daily feed: ${{ steps.report.outputs.date }} (${{ steps.report.outputs.count }} items)"
          git pull --rebase origin main
          git push origin HEAD:main
